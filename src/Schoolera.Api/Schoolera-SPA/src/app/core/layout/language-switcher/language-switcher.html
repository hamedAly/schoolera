<div class="language-switcher">
  <span class="visually-hidden" id="language-switcher-label">{{ 'language.label' | transloco }}</span>
  <button
    type="button"
    class="language-switcher__button"
    [attr.aria-labelledby]="'language-switcher-label'"
    [attr.aria-label]="nextLabelKey() | transloco"
    (click)="switchLanguage()"
  >
    <svg class="language-switcher__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7" />
      <path
        d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      />
    </svg>
    <span>{{ nextLabelKey() | transloco }}</span>
  </button>
</div>
