<div class="table-wrap">
  <table>
    <thead>
      <tr>
        @for (column of columns(); track column.key) {
          <th scope="col">{{ column.label }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row) {
        <tr>
          @for (column of columns(); track column.key) {
            <td>{{ row[column.key] }}</td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
