@if (items().length > 0) {
  <nav class="breadcrumbs" aria-label="مسار التنقل">
    <ol>
      @for (item of items(); track item.label; let last = $last) {
        <li>
          @if (!last && item.route) {
            <a [routerLink]="item.route">{{ item.label }}</a>
          } @else {
            <span [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span>
          }
        </li>
      }
    </ol>
  </nav>
}
