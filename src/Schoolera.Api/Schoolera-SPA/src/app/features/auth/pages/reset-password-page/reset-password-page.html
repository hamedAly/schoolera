<se-public-page-container>
  <se-breadcrumbs
    [items]="[
      { label: 'common.home' | transloco, route: '/' },
      { label: 'auth.resetPassword.breadcrumb' | transloco },
    ]"
  />
  <se-page-hero
    [title]="'auth.resetPassword.title' | transloco"
    [subtitle]="'auth.resetPassword.subtitle' | transloco"
  />

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <se-form-error-summary [errors]="summaryErrors()" />
    @if (successMessage()) {
      <p class="auth-form__success" role="status">{{ successMessage() }}</p>
    }

    <se-form-field
      controlId="email"
      [label]="'auth.fields.email' | transloco"
      [error]="fieldError('email')"
    >
      <input
        id="email"
        seAutofocus
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="hasFieldError('email')"
        [attr.aria-describedby]="hasFieldError('email') ? 'email-error' : null"
      />
    </se-form-field>

    <se-form-field
      controlId="token"
      [label]="'auth.fields.resetToken' | transloco"
      [error]="fieldError('token')"
    >
      <input
        id="token"
        type="text"
        formControlName="token"
        autocomplete="off"
        [attr.aria-invalid]="hasFieldError('token')"
        [attr.aria-describedby]="hasFieldError('token') ? 'token-error' : null"
      />
    </se-form-field>

    <se-form-field
      controlId="newPassword"
      [label]="'auth.fields.newPassword' | transloco"
      [error]="fieldError('newPassword')"
    >
      <input
        id="newPassword"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        [attr.aria-invalid]="hasFieldError('newPassword')"
        [attr.aria-describedby]="hasFieldError('newPassword') ? 'newPassword-error' : null"
      />
    </se-form-field>

    <se-form-field
      controlId="confirmPassword"
      [label]="'auth.fields.confirmPassword' | transloco"
      [error]="fieldError('confirmPassword')"
    >
      <input
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [attr.aria-invalid]="hasFieldError('confirmPassword')"
        [attr.aria-describedby]="hasFieldError('confirmPassword') ? 'confirmPassword-error' : null"
      />
    </se-form-field>

    <div class="auth-form__actions">
      <se-button type="submit" [disabled]="submitting()">
        {{
          submitting()
            ? ('auth.actions.resetting' | transloco)
            : ('auth.actions.resetPassword' | transloco)
        }}
      </se-button>
    </div>

    <p class="auth-form__links">
      <a routerLink="/auth/login">{{ 'auth.resetPassword.backToLogin' | transloco }}</a>
    </p>
  </form>
</se-public-page-container>
