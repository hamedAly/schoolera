<se-public-page-container>
  <se-breadcrumbs
    [items]="[
      { label: 'common.home' | transloco, route: '/' },
      { label: 'auth.forgotPassword.breadcrumb' | transloco },
    ]"
  />
  <se-page-hero
    [title]="'auth.forgotPassword.title' | transloco"
    [subtitle]="'auth.forgotPassword.subtitle' | transloco"
  />

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (errorMessage()) {
      <p class="auth-form__alert" role="alert">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <p class="auth-form__success" role="status">{{ successMessage() }}</p>
    }

    <se-form-field [label]="'auth.fields.email' | transloco" [error]="fieldError()">
      <input seAutofocus type="email" formControlName="email" autocomplete="email" />
    </se-form-field>

    <div class="auth-form__actions">
      <se-button type="submit" [disabled]="submitting()">
        {{
          submitting()
            ? ('auth.actions.sending' | transloco)
            : ('auth.actions.sendResetLink' | transloco)
        }}
      </se-button>
    </div>

    <p class="auth-form__links">
      <a routerLink="/auth/login">{{ 'auth.forgotPassword.backToLogin' | transloco }}</a>
    </p>
  </form>
</se-public-page-container>
