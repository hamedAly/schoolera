@if (open()) {
  <div class="confirmation-dialog" role="dialog" aria-modal="true">
    <div class="confirmation-dialog__panel">
      <h2 class="confirmation-dialog__title">{{ titleKey() | transloco }}</h2>
      <p class="confirmation-dialog__message">{{ messageKey() | transloco }}</p>
      <div class="confirmation-dialog__actions">
        <se-button type="button" variant="secondary" [disabled]="confirming()" (click)="cancelled.emit()">
          {{ cancelKey() | transloco }}
        </se-button>
        <se-button type="button" [disabled]="confirming()" (click)="confirmed.emit()">
          {{ confirmKey() | transloco }}
        </se-button>
      </div>
    </div>
  </div>
}
