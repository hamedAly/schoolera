<se-page-header
  title="Schoolera Operations"
  description="A feature-first client structure for the school management workflow."
/>

<section class="summary-grid" aria-label="Schoolera modules">
  @for (module of modules; track module.label) {
    <a class="summary-card" [routerLink]="module.route">
      <span>{{ module.label }}</span>
      <strong>{{ module.value }}</strong>
      <small>{{ module.state }}</small>
    </a>
  }
</section>

<section class="panel">
  <div>
    <h2>Backend contract</h2>
    <p>Feature data-access services consume the API Result&lt;T&gt; response shape.</p>
  </div>
  <code>GET /api/schools</code>
</section>
