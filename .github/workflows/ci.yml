name: ci

on:
  pull_request:
  push:
    branches: [Phase1, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Schoolera.Tests uses WebApplicationFactory against real SQL (not in-memory).
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "Schoolera_E2E_Sql_Passw0rd!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        # No Docker health-cmd: mssql image shell lacks bash /dev/tcp and GHA
        # marks the service failed even when SQL is ready. We wait in a step instead.

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=SchooleraDb;User Id=sa;Password=Schoolera_E2E_Sql_Passw0rd!;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      # Must match AuthTestHelpers.DefaultPassword used by integration tests.
      Auth__SeedUsers__DefaultPassword: "Schoolera@Dev1"
      Database__ApplyMigrations: "true"
      Database__SeedData: "true"
      Nswag__Enabled: "false"
      HttpsRedirection__Enabled: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: src/Schoolera.Api/Schoolera-SPA/package-lock.json

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433' 2>/dev/null; then
              echo "SQL port is open (attempt $i)"
              if [ "$i" -ge 10 ]; then
                sleep 15
                exit 0
              fi
            else
              echo "Waiting for SQL port 1433... ($i)"
            fi
            sleep 2
          done
          echo "SQL Server did not become ready"
          docker ps -a || true
          exit 1

      - name: Restore and test .NET
        run: |
          dotnet restore Schoolera.slnx
          dotnet build Schoolera.slnx -c Release --no-restore
          dotnet test tests/Schoolera.Tests/Schoolera.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: SPA install, i18n, unit tests
        working-directory: src/Schoolera.Api/Schoolera-SPA
        run: |
          npm ci
          npm run i18n:check
          npm run i18n:validate
          npx ng test --watch=false
