name: ci

on:
  pull_request:
  push:
    branches: [Phase1, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: src/Schoolera.Api/Schoolera-SPA/package-lock.json

      - name: Restore and test .NET
        run: |
          dotnet restore Schoolera.slnx
          dotnet build Schoolera.slnx -c Release --no-restore
          dotnet test tests/Schoolera.Tests/Schoolera.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: SPA install, i18n, unit tests
        working-directory: src/Schoolera.Api/Schoolera-SPA
        run: |
          npm ci
          npm run i18n:check
          npm run i18n:validate
          npx ng test --watch=false
